services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      ENABLE_BASELINE_COMPARISON: ${ENABLE_BASELINE_COMPARISON:-false}
      OLLAMA_CONTEXT: ${OLLAMA_CONTEXT:-8192}
      OLLAMA_OUTPUT_TOKENS: ${OLLAMA_OUTPUT_TOKENS:-1200}
      COMPRESSION_DEVICE: cpu
    volumes:
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  ollama_models:
